<!doctype html>
<html lang="en">
  <head>
    <script>
      if (typeof global === 'undefined') {
        window.global = window;
      }
      if (typeof process === 'undefined') {
        window.process = { env: {} };
      }
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DSA Tracker – Track your coding journey, take mock tests, analyze resumes, and get contest reminders. The ultimate placement preparation platform." />
    <meta name="keywords" content="DSA, placement preparation, coding contests, mock tests, resume analyzer, LeetCode tracker" />
    <!-- Open Graph -->
    <meta property="og:title" content="DSA Tracker – Placement Preparation Platform" />
    <meta property="og:description" content="Track DSA progress, take mock tests, get contest reminders, and land your dream job." />
    <meta property="og:type" content="website" />
    <!-- Security headers via meta (enhanced by server-level headers) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>DSA Tracker – Placement Preparation Platform</title>
  </head>
  <style>
    #initial-loader {
      position: fixed; inset: 0; background: #080c14; display: flex; 
      align-items: center; justify-content: center; z-index: 9999;
      flex-direction: column; gap: 16px; font-family: 'Inter', sans-serif; color: #f1f5f9;
    }
    .spinner-ring {
      width: 48px; height: 48px; border: 4px solid rgba(99,102,241,0.2); 
      border-top-color: #6366f1; border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="spinner-ring"></div>
        <div style="font-weight:600; letter-spacing:1px; color:#818cf8;">Starting PrepNest...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
