# ── Server ──────────────────────────────────────────────────────────────────
server.port=8080
spring.config.import=optional:dotenv:./.env

# ── MongoDB ──────────────────────────────────────────────────────────────────
# TODO(security): Use mTLS for MongoDB connection in production.
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/dsatracker}

# ── Redis ────────────────────────────────────────────────────────────────────
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.repositories.enabled=false

# ── JWT ──────────────────────────────────────────────────────────────────────
# Secret is loaded from env; if absent, app will fail-fast at startup.
# Never hardcode a fallback literal here.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000

# ── Mail (Gmail SMTP) ─────────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Async ─────────────────────────────────────────────────────────────────────
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100

# ── Scheduling ───────────────────────────────────────────────────────────────
spring.task.scheduling.pool.size=4

# ── Actuator (disabled by default; enable selectively in prod) ───────────────
management.endpoints.web.exposure.include=health,info

# ── Application-level config ─────────────────────────────────────────────────
app.otp.ttl-seconds=300
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
